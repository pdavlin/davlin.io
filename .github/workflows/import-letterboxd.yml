name: Sync Content

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6am UTC (midnight CST)
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The deploy key is the only actor that can push straight to main: the branch
      # ruleset requires the Run Tests check but grants deploy keys a bypass.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      # Version comes from `packageManager` in package.json -- setting it here too makes
      # action-setup error on a mismatch, and keeps CI from drifting off the local pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Letterboxd import
      - name: Import Letterboxd reviews
        run: pnpm import:letterboxd

      - name: Format imported films
        run: pnpm exec prettier --write "src/content/notes/films/*.md"

      # Coffee data no longer syncs here: the coffee service on exe.dev fetches shots from
      # visualizer.coffee and fires a Netlify build hook; `pnpm build` pulls the payload.

      # Check for any changes
      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain src/content/notes/films/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/notes/films/
          git commit -m "chore: sync content (films)"
          git push
