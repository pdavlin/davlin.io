name: Sync Content

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6am UTC (midnight CST)
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json -- setting it here too makes
      # action-setup error on a mismatch, and keeps CI from drifting off the local pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Letterboxd import
      - name: Import Letterboxd reviews
        run: pnpm import:letterboxd

      - name: Format imported films
        run: pnpm exec prettier --write "src/content/notes/films/*.md"

      # Coffee data import
      - name: Fetch coffee data from Airtable
        run: node scripts/fetch-coffee-data.js
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}

      - name: Format coffee data
        run: pnpm exec prettier --write "src/data/coffee.json"

      # Check for any changes
      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain src/content/notes/films/ src/data/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/notes/films/ src/data/
          git commit -m "chore: sync content (films + coffee)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
